<style>

.controls{display:flex;gap:8px;pointer-events:auto}.controls button{height:38px;padding:0 13px;border-radius:999px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.08);backdrop-filter:blur(14px);color:rgba(255,255,255,.82);font-size:10px;letter-spacing:.04em;cursor:pointer;box-shadow:0 5px 18px rgba(0,0,0,.18)}.controls button:hover{background:rgba(255,255,255,.14);color:#fff}.controls button:focus-visible{outline:1px solid rgba(255,255,255,.65);outline-offset:2px}
.toast{position:absolute;left:50%;bottom:42px;transform:translate(-50%,12px);padding:9px 12px;border:1px solid rgba(20,20,20,.08);border-radius:999px;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);font-size:10px;letter-spacing:.08em;color:#161616;box-shadow:0 10px 30px rgba(0,0,0,.08);opacity:0;transition:.24s ease;pointer-events:none;z-index:7}.toast.show{opacity:1;transform:translate(-50%,0)}

<script type="module">
const CARD_DATA = await fetch('./data/cards.json', {cache:'no-store'}).then(response => { if(!response.ok) throw new Error('Card data unavailable'); return response.json(); });
const app=document.getElementById('app');
const canvas=document.getElementById('scene');
const loader=document.getElementById('loader');
const resetBtn=document.getElementById('resetBtn');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
const floatBtn=document.getElementById('floatBtn');
const stateText={textContent:''};
const readout={innerHTML:''};
const toast=document.getElementById('toast');

const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/+esm');
const [{OrbitControls},{RoundedBoxGeometry},{EffectComposer},{RenderPass},{BokehPass},{OutputPass},{RectAreaLightUniformsLib}]=await Promise.all([
 import('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js/+esm'),
 import('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/geometries/RoundedBoxGeometry.js/+esm'),
 import('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/postprocessing/EffectComposer.js/+esm'),
 import('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/postprocessing/RenderPass.js/+esm'),
 import('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/postprocessing/BokehPass.js/+esm'),
 import('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/postprocessing/OutputPass.js/+esm'),
 import('https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/lights/RectAreaLightUniformsLib.js/+esm')
]);
RectAreaLightUniformsLib.init();

const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x1d1e23);
scene.fog=new THREE.FogExp2(0x25262b,.0132);
const camera=new THREE.PerspectiveCamera(34,1,.1,120);
camera.position.set(2.6,.95,17.4);

const controls=new OrbitControls(camera,canvas);
controls.target.set(.8,-.35,-8.8);
controls.enableDamping=true;controls.dampingFactor=.055;
controls.rotateSpeed=.6;controls.panSpeed=.68;controls.zoomSpeed=.7;
controls.minDistance=7.2;controls.maxDistance=36;
controls.minPolarAngle=.08;controls.maxPolarAngle=Math.PI-.08;
controls.screenSpacePanning=true;
controls.enablePan=true;
// LEFT is intentionally unbound inside OrbitControls.
// Camera rotation is implemented explicitly below and only starts with Ctrl + left-drag on blank space.
controls.mouseButtons.LEFT=-1;
controls.mouseButtons.MIDDLE=THREE.MOUSE.DOLLY;
controls.mouseButtons.RIGHT=THREE.MOUSE.PAN;
canvas.addEventListener('contextmenu',e=>e.preventDefault());

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bokeh=new BokehPass(scene,camera,{focus:10,aperture:.00019,maxblur:.009,width:1200,height:800});
composer.addPass(bokeh);composer.addPass(new OutputPass());


scene.add(new THREE.AmbientLight(0xffffff,.115));
const hemi=new THREE.HemisphereLight(0xd9dee7,0x101115,.17);scene.add(hemi);

// ---------- procedural material texture helpers ----------
function makeSurfaceTexture(kind='metal',size=512){
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');
  g.fillStyle='#808080';g.fillRect(0,0,size,size);
  const img=g.getImageData(0,0,size,size);const d=img.data;
  for(let i=0;i<d.length;i+=4){
    const n=(Math.random()-.5)*(kind==='concrete'?72:48);
    const base=kind==='concrete'?138:126;
    const v=Math.max(30,Math.min(225,base+n));
    d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;
  }
  g.putImageData(img,0,0);
  g.globalAlpha=kind==='metal'?.18:.10;
  g.strokeStyle='#d4d4d4';g.lineWidth=1;
  const scratches=kind==='metal'?130:50;
  for(let i=0;i<scratches;i++){
    const x=Math.random()*size,y=Math.random()*size;
    const len=(kind==='metal'?18:38)+Math.random()*(kind==='metal'?72:130);
    g.beginPath();g.moveTo(x,y);g.lineTo(x+len,y+(Math.random()-.5)*6);g.stroke();
  }
  g.globalAlpha=1;
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(kind==='concrete'?5:2.6,kind==='concrete'?5:2.6);
  return t;
}
const concreteTex=makeSurfaceTexture('concrete');
const metalTex=makeSurfaceTexture('metal');

// ---------- physical room ----------
const architecture=new THREE.Group();scene.add(architecture);
const wallMat=new THREE.MeshStandardMaterial({
  color:0x37393e,roughness:.95,metalness:0,
  roughnessMap:concreteTex,bumpMap:concreteTex,bumpScale:.035
});
const floorMat=new THREE.MeshStandardMaterial({
  color:0x292b30,roughness:.90,metalness:0,
  roughnessMap:concreteTex,bumpMap:concreteTex,bumpScale:.045
});
const ceilingMat=new THREE.MeshStandardMaterial({
  color:0x25272c,roughness:.96,metalness:0,
  roughnessMap:concreteTex,bumpMap:concreteTex,bumpScale:.025
});
function roomBox(w,h,d,x,y,z,mat){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);m.receiveShadow=true;m.castShadow=false;architecture.add(m);return m;
}
const floor=roomBox(44,.38,80,0,-7.0,-10,floorMat);
roomBox(44,.30,80,0,10.4,-10,ceilingMat);
roomBox(.36,18,80,-20.0,1.6,-10,wallMat);
roomBox(.36,18,80,20.0,1.6,-10,wallMat);
roomBox(22,18,.45,0,1.55,-36.2,new THREE.MeshStandardMaterial({
  color:0x303238,roughness:.93,metalness:0,
  roughnessMap:concreteTex,bumpMap:concreteTex,bumpScale:.03
}));

// ---------- large industrial exhaust fan ----------
const fanGroup=new THREE.Group();
fanGroup.position.set(0,1.4,-35.45);
architecture.add(fanGroup);

const fanDarkMetal=new THREE.MeshPhysicalMaterial({
  color:0x36383c,roughness:.66,metalness:.52,
  roughnessMap:metalTex,bumpMap:metalTex,bumpScale:.028,
  clearcoat:.08,clearcoatRoughness:.55
});
const fanEdgeMetal=new THREE.MeshPhysicalMaterial({
  color:0x54575a,roughness:.54,metalness:.64,
  roughnessMap:metalTex,bumpMap:metalTex,bumpScale:.022,
  clearcoat:.12,clearcoatRoughness:.48
});
const bladeMaterial=new THREE.MeshPhysicalMaterial({
  color:0x24262a,roughness:.58,metalness:.62,
  roughnessMap:metalTex,bumpMap:metalTex,bumpScale:.02,
  clearcoat:.05,clearcoatRoughness:.62
});

// cylindrical duct + thick front rings
const fanDuct=new THREE.Mesh(new THREE.CylinderGeometry(6.0,6.0,1.8,72,1,true),fanDarkMetal);
fanDuct.rotation.x=Math.PI/2;fanDuct.castShadow=true;fanDuct.receiveShadow=true;fanGroup.add(fanDuct);
[-.78,.75].forEach(z=>{
  const ring=new THREE.Mesh(new THREE.TorusGeometry(5.65,.32,18,80),fanEdgeMetal);
  ring.position.z=z;ring.castShadow=true;ring.receiveShadow=true;fanGroup.add(ring);
});

// luminous exterior beyond fan — actual circular surface, not a rectangular card
const exteriorMat=new THREE.MeshStandardMaterial({
  color:0xf1efe7,emissive:0xf7f4e9,emissiveIntensity:2.15,
  roughness:.86,metalness:0,side:THREE.DoubleSide
});
const exteriorDisc=new THREE.Mesh(new THREE.CircleGeometry(5.35,72),exteriorMat);
exteriorDisc.position.z=-1.08;fanGroup.add(exteriorDisc);

// rotor blades with real thickness
const rotor=new THREE.Group();rotor.position.z=-.02;fanGroup.add(rotor);
const bladeShape=new THREE.Shape();
bladeShape.moveTo(.76,-.26);
bladeShape.bezierCurveTo(1.5,-.50,3.05,-.46,4.68,-.05);
bladeShape.bezierCurveTo(4.92,.10,4.96,.42,4.67,.82);
bladeShape.bezierCurveTo(3.35,.72,1.72,.54,.76,.28);
bladeShape.closePath();
const bladeGeo=new THREE.ExtrudeGeometry(bladeShape,{
  depth:.22,bevelEnabled:true,bevelThickness:.05,bevelSize:.045,bevelSegments:3,curveSegments:18
});
bladeGeo.translate(0,0,-.11);
for(let i=0;i<6;i++){
  const blade=new THREE.Mesh(bladeGeo,bladeMaterial);
  blade.rotation.z=i*Math.PI/3+.14;
  blade.rotation.x=.035;
  blade.castShadow=true;blade.receiveShadow=true;rotor.add(blade);
}
const hub=new THREE.Mesh(new THREE.CylinderGeometry(.86,.86,.78,36),fanEdgeMetal);
hub.rotation.x=Math.PI/2;hub.castShadow=true;hub.receiveShadow=true;rotor.add(hub);
const hubCap=new THREE.Mesh(new THREE.SphereGeometry(.60,28,18),fanDarkMetal);
hubCap.scale.z=.55;hubCap.position.z=.46;hubCap.castShadow=true;rotor.add(hubCap);

// protective grille: physical concentric rings and radial struts
const grille=new THREE.Group();grille.position.z=.94;fanGroup.add(grille);
[1.35,2.35,3.35,4.35,5.15].forEach(r=>{
  const ring=new THREE.Mesh(new THREE.TorusGeometry(r,.038,8,64),fanEdgeMetal);
  ring.castShadow=true;grille.add(ring);
});
for(let i=0;i<16;i++){
  const bar=new THREE.Mesh(new THREE.BoxGeometry(.045,10.35,.07),fanEdgeMetal);
  bar.rotation.z=i*Math.PI/16;bar.castShadow=true;grille.add(bar);
}

// backlight passes THROUGH the real fan geometry so blade shadows are physical
const fanBackLight=new THREE.SpotLight(0xfff4dd,31.5,84,.58,.68,1.12);
fanBackLight.position.set(0,1.9,-41.8);
fanBackLight.castShadow=true;
fanBackLight.shadow.mapSize.set(2048,2048);
fanBackLight.shadow.bias=-.00022;
fanBackLight.shadow.normalBias=.018;
fanBackLight.shadow.radius=3;
fanBackLight.shadow.camera.near=1;
fanBackLight.shadow.camera.far=80;
scene.add(fanBackLight);
const fanLightTarget=new THREE.Object3D();
fanLightTarget.position.set(0,-5.6,-4.2);scene.add(fanLightTarget);fanBackLight.target=fanLightTarget;

// soft ambient spill from the bright exterior, without replacing the real shadow-casting spotlight
const fanFill=new THREE.RectAreaLight(0xf5efe3,2.15,12.5,12.5);
fanFill.position.set(0,2.2,-34.8);fanFill.lookAt(0,-1.0,-11.2);scene.add(fanFill);

// subtle dust for depth only — no fake beam polygons
const dustN=320,dustArr=new Float32Array(dustN*3);
for(let i=0;i<dustN;i++){
  dustArr[i*3]=(Math.random()-.5)*28;
  dustArr[i*3+1]=(Math.random()-.5)*15;
  dustArr[i*3+2]=-22+Math.random()*32;
}
const dustGeo=new THREE.BufferGeometry();dustGeo.setAttribute('position',new THREE.BufferAttribute(dustArr,3));
const dust=new THREE.Points(dustGeo,new THREE.PointsMaterial({
  color:0xd6d2c8,size:.014,transparent:true,opacity:.038,depthWrite:false
}));scene.add(dust);

// Load real covers + merged detail images
function loadImage(src){return new Promise(resolve=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>{const c=document.createElement('canvas');c.width=32;c.height=32;const g=c.getContext('2d');g.fillStyle='#202124';g.fillRect(0,0,32,32);resolve(c)};im.decoding='async';im.src=src})}
const images=await Promise.all(CARD_DATA.map(d=>loadImage(d.cover_data)));
const detailImages=await Promise.all(CARD_DATA.map(async d=>Promise.all((d.detail_data||[]).map(src=>loadImage(src)))));
loader.style.display='none';

const texCanvases=new Map();
function roundedRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawCoverFill(ctx,img,x,y,w,h){const ir=img.width/img.height,rr=w/h;let sx=0,sy=0,sw=img.width,sh=img.height;if(ir>rr){sw=img.height*rr;sx=(img.width-sw)/2}else{sh=img.width/rr;sy=(img.height-sh)/2}ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h)}
function drawImageContain(ctx,img,x,y,w,h,pad=0){const iw=Math.max(1,img.width||1),ih=Math.max(1,img.height||1);const aw=Math.max(1,w-pad*2),ah=Math.max(1,h-pad*2);const s=Math.min(aw/iw,ah/ih);const dw=iw*s,dh=ih*s,dx=x+(w-dw)/2,dy=y+(h-dh)/2;ctx.drawImage(img,0,0,iw,ih,dx,dy,dw,dh)}
function wrapText(ctx,text,x,y,maxW,lineH,maxLines){const chars=[...text];let line='',lines=[];for(const ch of chars){const test=line+ch;if(ctx.measureText(test).width>maxW&&line){lines.push(line);line=ch;if(lines.length===maxLines-1)break}else line=test}if(lines.length<maxLines&&line)lines.push(line);lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineH));}
function makeCardTexture(i,selected=false,copied=false){
 const data=CARD_DATA[i],img=images[i];const c=document.createElement('canvas');c.width=900;c.height=1280;const g=c.getContext('2d');
 g.fillStyle='#0b0b0b';g.fillRect(0,0,c.width,c.height);
 const coverH=selected?690:1010;drawCoverFill(g,img,0,0,900,coverH);
 const grad=g.createLinearGradient(0,coverH-170,0,coverH+120);grad.addColorStop(0,'rgba(8,8,8,0)');grad.addColorStop(1,'rgba(8,8,8,1)');g.fillStyle=grad;g.fillRect(0,coverH-170,900,300);
 g.fillStyle='rgba(255,255,255,.52)';g.font='600 25px Arial,"Microsoft YaHei",sans-serif';g.fillText(data.type,58,selected?735:1080);
 if(!selected){
  g.fillStyle='#f1eee7';g.font='700 41px Arial,"Microsoft YaHei",sans-serif';wrapText(g,data.title_cn,58,1140,784,50,2);
  g.fillStyle='rgba(255,255,255,.45)';g.font='500 21px Arial,sans-serif';g.fillText(data.title_en,58,1230);
 }else{
  g.fillStyle='#f1eee7';g.font='700 46px Arial,"Microsoft YaHei",sans-serif';wrapText(g,data.title_cn,58,805,760,54,2);
  g.fillStyle='rgba(255,255,255,.44)';g.font='500 21px Arial,sans-serif';g.fillText(data.title_en,58,895);
  g.fillStyle='rgba(255,255,255,.72)';g.font='500 27px Arial,"Microsoft YaHei",sans-serif';wrapText(g,data.intro,58,958,784,38,2);
  let tx=58;g.font='600 20px Arial,"Microsoft YaHei",sans-serif';data.tags.slice(0,3).forEach(tag=>{const tw=g.measureText(tag).width+40;g.fillStyle='rgba(255,255,255,.07)';roundedRect(g,tx,1038,tw,48,24);g.fill();g.fillStyle='rgba(255,255,255,.66)';g.fillText(tag,tx+20,1070);tx+=tw+12});
  // buttons
  g.fillStyle='#f1eee7';roundedRect(g,58,1130,355,88,4);g.fill();g.fillStyle='#111';g.font='700 25px Arial,"Microsoft YaHei",sans-serif';g.textAlign='center';g.fillText(copied?'已复制':'复制提示词',235.5,1185);
  g.fillStyle='rgba(255,255,255,.08)';roundedRect(g,431,1130,355,88,4);g.fill();g.strokeStyle='rgba(255,255,255,.15)';g.lineWidth=2;g.stroke();g.fillStyle='#f1eee7';g.fillText('查看细节',608.5,1185);
  g.textAlign='left';
  g.fillStyle='rgba(255,255,255,.42)';g.font='500 22px Arial,sans-serif';g.fillText('×',823,62);
 }
 const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());t.needsUpdate=true;return t;
}

function makePlayerTexture(cardIndex,active=0){
 const data=CARD_DATA[cardIndex],cover=images[cardIndex],details=detailImages[cardIndex]||[];
 const previews=details.length?details:[cover];
 const safeActive=Math.max(0,Math.min(active,previews.length-1));
 const mainImg=previews[safeActive]||cover;
 const c=document.createElement('canvas');c.width=1500;c.height=1000;const g=c.getContext('2d');
 g.fillStyle='#0a0a0a';g.fillRect(0,0,1500,1000);
 g.fillStyle='rgba(255,255,255,.45)';g.font='600 24px Arial,"Microsoft YaHei",sans-serif';g.fillText('DETAIL PLAYER',54,62);
 g.fillStyle='#f2eee6';g.font='700 36px Arial,"Microsoft YaHei",sans-serif';g.fillText(data.title_cn,54,112);
 g.beginPath();g.arc(1430,58,36,0,Math.PI*2);g.fillStyle='rgba(255,255,255,.13)';g.fill();g.strokeStyle='rgba(255,255,255,.58)';g.lineWidth=2;g.stroke();
 g.fillStyle='rgba(255,255,255,.94)';g.font='500 40px Arial,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('×',1430,57);g.textAlign='left';g.textBaseline='alphabetic';
 g.fillStyle='#111214';g.fillRect(54,150,1392,610);
 g.strokeStyle='rgba(255,255,255,.07)';g.lineWidth=2;g.strokeRect(54.5,150.5,1391,609);
 drawImageContain(g,mainImg,54,150,1392,610,18);
 const thumbCount=Math.max(4,Math.min(6,previews.length)),gap=18,thumbW=(1392-gap*(thumbCount-1))/thumbCount,thumbY=795,thumbH=150;
 for(let k=0;k<thumbCount;k++){
  const x=54+k*(thumbW+gap),img=previews[k];
  if(img){
    g.fillStyle='#111214';g.fillRect(x,thumbY,thumbW,thumbH);
    g.save();g.globalAlpha=k===safeActive?1:.58;drawImageContain(g,img,x,thumbY,thumbW,thumbH,8);g.restore();
